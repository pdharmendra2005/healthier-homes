<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Arial, sans-serif" font-size="14">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <rect width="900" height="560" fill="#fff"/>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold">Healthier Homes - how the prototype works</text>

  <!-- users -->
  <rect x="30" y="70" width="190" height="70" rx="8" fill="#e8f1fb" stroke="#1d70b8"/>
  <text x="125" y="98" text-anchor="middle" font-weight="bold">Tenant (on phone)</text>
  <text x="125" y="118" text-anchor="middle">"I have mould"</text>
  <rect x="30" y="200" width="190" height="70" rx="8" fill="#e8f1fb" stroke="#1d70b8"/>
  <text x="125" y="228" text-anchor="middle" font-weight="bold">Housing officer</text>
  <text x="125" y="248" text-anchor="middle">"Who do I visit first?"</text>
  <rect x="30" y="330" width="190" height="70" rx="8" fill="#e8f1fb" stroke="#1d70b8"/>
  <text x="125" y="358" text-anchor="middle" font-weight="bold">Other service / QA test</text>
  <text x="125" y="378" text-anchor="middle">JSON API</text>

  <!-- controllers -->
  <rect x="290" y="60" width="280" height="360" rx="8" fill="#f3f2f1" stroke="#505a5f"/>
  <text x="430" y="82" text-anchor="middle" font-weight="bold">Play app (conf/routes -> controllers)</text>
  <rect x="310" y="95" width="240" height="60" rx="6" fill="#fff" stroke="#333"/>
  <text x="430" y="118" text-anchor="middle" font-weight="bold">ReportController</text>
  <text x="430" y="138" text-anchor="middle">GET/POST /report</text>
  <rect x="310" y="205" width="240" height="60" rx="6" fill="#fff" stroke="#333"/>
  <text x="430" y="228" text-anchor="middle" font-weight="bold">DashboardController</text>
  <text x="430" y="248" text-anchor="middle">GET /   GET /homes/:id   POST visit</text>
  <rect x="310" y="335" width="240" height="60" rx="6" fill="#fff" stroke="#333"/>
  <text x="430" y="358" text-anchor="middle" font-weight="bold">ApiController</text>
  <text x="430" y="378" text-anchor="middle">GET /api/homes/at-risk</text>

  <!-- services -->
  <rect x="630" y="150" width="240" height="80" rx="6" fill="#fff4e5" stroke="#b35900"/>
  <text x="750" y="175" text-anchor="middle" font-weight="bold">HomesService + RiskService</text>
  <text x="750" y="195" text-anchor="middle">score 0-100 + reasons</text>
  <text x="750" y="215" text-anchor="middle">High / Medium / Low</text>
  <rect x="630" y="290" width="240" height="80" rx="6" fill="#e9f5ee" stroke="#00703c"/>
  <text x="750" y="315" text-anchor="middle" font-weight="bold">HomeRepository</text>
  <text x="750" y="335" text-anchor="middle">homes, sensor readings,</text>
  <text x="750" y="355" text-anchor="middle">tenant reports (in memory)</text>

  <g stroke="#333" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="220" y1="105" x2="308" y2="125"/>
    <line x1="220" y1="235" x2="308" y2="235"/>
    <line x1="220" y1="365" x2="308" y2="365"/>
    <line x1="550" y1="125" x2="680" y2="290"/>
    <line x1="550" y1="235" x2="628" y2="200"/>
    <line x1="550" y1="365" x2="628" y2="215"/>
    <line x1="750" y1="230" x2="750" y2="288"/>
  </g>
  <text x="565" y="110" font-size="12">saves report</text>

  <!-- scoring rules -->
  <rect x="30" y="440" width="840" height="100" rx="8" fill="#fff" stroke="#d4351c"/>
  <text x="45" y="465" font-weight="bold">Risk score rules (last 14 days of sensor data, last 90 days of reports)</text>
  <text x="45" y="488">+25 cold: below 18°C on half the days    +25 damp: humidity over 70% on half the days    +25 mould reported</text>
  <text x="45" y="508">+10 EPC E/F/G (poor insulation)    +5 no sensor data    x1.3 if child under 5, over 65 or breathing condition</text>
  <text x="45" y="528">60+ = High (visit first)    30-59 = Medium    under 30 = Low    capped at 100</text>
</svg>
